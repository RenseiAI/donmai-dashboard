apiVersion: v1
kind: RepositoryConfig
repository: github.com/RenseiAI/donmai-dashboard
mergeDriver: mergiraf
mergeQueue:
  enabled: true
  provider: github-native
  strategy: rebase
  mergiraf: true
  lockFileRegenerate: true
  autoEnqueue: true
  testCommand: "pnpm test"
  testTimeout: 300000
  pollInterval: 10000
  maxRetries: 2
  escalation:
    onConflict: reassign
    onTestFailure: notify
